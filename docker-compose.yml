services:
  api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - LLM_PROVIDER=demo
      - CORS_ORIGINS=http://localhost:5173,http://127.0.0.1:5173
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  web:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - api
    environment:
      VITE_API_PROXY: http://api:8000
