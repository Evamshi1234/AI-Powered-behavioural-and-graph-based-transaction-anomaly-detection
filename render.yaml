# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: healthcare-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: LLM_PROVIDER
        value: demo
      - key: CORS_ORIGINS
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: DATABASE_URL
        value: sqlite:////data/healthcare.db
    disk:
      name: healthcare-db
      mountPath: /data
      sizeGB: 1

  - type: web
    name: healthcare-ui
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile.prod
    dockerContext: ./frontend
    plan: free
    envVars:
      - key: API_UPSTREAM
        fromService:
          name: healthcare-api
          type: web
          property: host
